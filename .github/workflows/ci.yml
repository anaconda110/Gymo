name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web（svelte-check + 单测 + e2e）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run check

      - name: 单元测试
        run: npm run test:unit

      - name: 安装 Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 构建 + e2e 闭环
        run: npm run test:e2e

  android:
    name: Android（assembleDebug）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 诊断：runner 直探 KSP marker 各源
        run: |
          V=2.0.21-1.0.27
          BASE="com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/$V/com.google.devtools.ksp.gradle.plugin-$V.pom"
          for u in \
            "https://maven.aliyun.com/repository/public/$BASE" \
            "https://repo.maven.apache.org/maven2/$BASE" \
            "https://plugins.gradle.org/m2/$BASE" \
            "https://dl.google.com/dl/android/maven2/$BASE" ; do
            echo "$u => $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u")"
          done

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: gymo-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
